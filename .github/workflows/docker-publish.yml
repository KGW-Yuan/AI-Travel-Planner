name: Build and Push Docker Images to ACR

# 当代码推送到 initial-setup 分支时触发此工作流
on:
  push:
    branches:
      - initial-setup

jobs:
  build-and-push-server:
    name: Build and Push Server Image
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行环境
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 登录到阿里云容器镜像服务 (ACR)
      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. 设置 Docker Buildx，这是一个高级的构建器
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4. 构建并推送后端 Docker 镜像
      - name="Build and push server image"
        uses: docker/build-push-action@v4
        with:
          context: ./server # Dockerfile 所在的上下文路径
          file: ./server/Dockerfile # Dockerfile 的具体路径
          push: true # 确认执行推送操作
          # 定义镜像的标签
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ai-travel-planner-server:latest

  build-and-push-client:
    name: Build and Push Client Image
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 登录到阿里云容器镜像服务 (ACR)
      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4. 构建并推送前端 Docker 镜像
      - name="Build and push client image"
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ai-travel-planner-client:latest